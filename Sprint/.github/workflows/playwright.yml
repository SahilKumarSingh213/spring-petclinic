name: FreeCRM BDD Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Cucumber BDD Test Suite
      env:
        FREECRM_BASE_URL: ${{ secrets.FREECRM_BASE_URL || 'https://ui.freecrm.com' }}
        FREECRM_EMAIL: ${{ secrets.FREECRM_EMAIL }}
        FREECRM_PASSWORD: ${{ secrets.FREECRM_PASSWORD }}
        HEADLESS: 'true'
      run: npm test

    - name: Generate Allure Report
      if: ${{ !cancelled() }}
      run: npm run report:generate || true

    - name: Upload Test Execution Artifacts
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-execution-artifacts
        path: |
          test-results/
          allure-results/
          allure-report/
        retention-days: 30
